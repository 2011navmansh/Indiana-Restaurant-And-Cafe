<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script><script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
<script>
const lenis=new Lenis({duration:1.35,lerp:0.075,smoothWheel:true});function raf(t){lenis.raf(t);requestAnimationFrame(raf)}requestAnimationFrame(raf);gsap.registerPlugin(ScrollTrigger);lenis.on('scroll',ScrollTrigger.update);
const tt=document.getElementById('themeToggle');const s=localStorage.getItem('indiana-theme');if(s==='light'){document.documentElement.classList.add('light');tt.textContent='☀️'}tt.onclick=()=>{const l=document.documentElement.classList.toggle('light');tt.textContent=l?'☀️':'🌙';localStorage.setItem('indiana-theme',l?'light':'dark')};
document.querySelectorAll('.gbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gbtn').forEach(x=>x.className='gbtn glass rounded-full px-5 py-2 text-xs font-bold');b.className='gbtn bg-mustard text-ink rounded-full px-5 py-2 text-xs font-extrabold';const f=b.dataset.f;document.querySelectorAll('.gcard').forEach(c=>{const show=f==='all'||c.dataset.cat===f;c.style.display=show?'block':'none';if(show)gsap.fromTo(c,{scale:0.94,opacity:0},{scale:1,opacity:1,duration:0.4})})});
const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg');document.querySelectorAll('.gcard img').forEach(img=>img.onclick=()=>{lbImg.src=img.src.replace('w=600','w=1400');lb.classList.remove('hidden');lb.classList.add('flex');gsap.fromTo(lbImg,{scale:0.92,opacity:0},{scale:1,opacity:1,duration:0.4})});document.getElementById('lbClose').onclick=()=>{lb.classList.add('hidden');lb.classList.remove('flex')};lb.onclick=e=>{if(e.target===lb){lb.classList.add('hidden');lb.classList.remove('flex')}};
gsap.from('.gcard',{y:20,opacity:0,stagger:0.06,duration:0.6,scrollTrigger:{trigger:'#grid',start:'top 85%'}});
</script></body></html>
