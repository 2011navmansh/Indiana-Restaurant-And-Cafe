<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Menu — Indiana Restaurant & Cafe</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/2j4wTB2c/image.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/2j4wTB2c/image.png">
  <meta name="description" content="Indiana Restaurant & Cafe ka full menu — soups, tandoori starters, Indo-Chinese, rich curries, paneer specials, biryani, burgers, breads, desserts & more. 100% vegetarian, Jhalawar me fresh made.">
  <script>
    try { if (localStorage.getItem('indiana-theme') === 'light') document.documentElement.classList.add('light'); } catch (e) { }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FFFBEB', mustard: '#FACC15', mustardDark: '#EAB308',
            ink: '#0A0A0A', stone900: '#1C1917', forest: '#0F2A18',
          },
          fontFamily: {
            display: ['Bebas Neue', 'cursive'],
            serif: ['Cormorant Garamond', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    :root { color-scheme: dark; }
    html.light { color-scheme: light; }
    * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100vw; }

    /* ===== LIGHT MODE ===== */
    html.light body { background: #FFFBEB !important; color: #0A0A0A !important; }
    html.light .bg-ink, html.light .bg-\[\#0A0A0A\], html.light section.bg-ink, html.light footer.bg-ink, html.light #drawer { background: #FFFBEB !important; color: #0A0A0A !important; }
    html.light .bg-forest { background: #FFF8DC !important; color: #0A0A0A !important; border-color: rgba(0,0,0,0.08) !important; }
    html.light .text-cream { color: #0A0A0A !important; }
    html.light .text-white, html.light [class*="text-white"] { color: #0A0A0A !important; }
    html.light .text-white\/60, html.light .text-white\/65, html.light .opacity-60, html.light .opacity-70 { color: rgba(10,10,10,0.65) !important; opacity: 1 !important; }
    html.light .border-white\/10, html.light .border-white\/5 { border-color: rgba(0,0,0,0.08) !important; }
    html.light .bg-white\/10, html.light .bg-white\/5 { background: rgba(0,0,0,0.06) !important; }
    html.light .bg-white { background: #FFFFFF !important; color: #0A0A0A !important; }
    html.light a.bg-white, html.light button.bg-white { background: linear-gradient(135deg,#FACC15 0%,#EAB308 100%) !important; color: #0A0A0A !important; box-shadow: 0 14px 30px -16px rgba(234,179,8,.85) !important; }
    html.light .glass { background: rgba(255,255,255,0.82) !important; border-color: rgba(0,0,0,0.07) !important; box-shadow: 0 8px 32px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.9) !important; color: #0A0A0A !important; }
    html.light .glass-dark { background: rgba(255,255,255,0.88) !important; border-color: rgba(0,0,0,0.07) !important; box-shadow: 0 8px 32px rgba(0,0,0,0.08) !important; color: #0A0A0A !important; }
    html.light .glass-dark a { color: #0A0A0A !important; }
    html.light #navbar .glass-dark { background: rgba(255,255,255,0.85) !important; backdrop-filter: blur(22px) saturate(180%) !important; }
    html.light .bg-mustard, html.light .bg-mustardDark { color: #0A0A0A !important; }
    html.light .text-mustard { color: #A16207 !important; }
    html.light #progress { background: #FACC15 !important; }
    html.light ::-webkit-scrollbar-track { background: #FFF7DC !important; }
    /* dark chips stay dark inside light cards */
    html.light :is(.bg-white,.glass,.glass-cream,.bg-mustard) .bg-ink { background: #0A0A0A !important; }
    html.light :is(.bg-white,.glass,.glass-cream,.bg-mustard) .bg-ink.text-mustard,
    html.light :is(.bg-white,.glass,.glass-cream,.bg-mustard) .bg-ink .text-mustard { color: #FACC15 !important; }
    html.light .veg-dot { background: #FFFFFF !important; }
    html.light .foot-link:hover { color: #A16207; }

    /* ===== GLASS ===== */
    .glass {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .glass-dark {
      background: rgba(12, 12, 12, 0.62);
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }
    .glass-cream { background: rgba(255, 251, 235, 0.92); backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, 0.6); }
    .liquid-shine { position: relative; overflow: hidden; }
    .liquid-shine::after {
      content: ""; position: absolute; top: 0; left: -140%; width: 55%; height: 100%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: skewX(-16deg); pointer-events: none;
      transition: left 0.9s cubic-bezier(0.2,0.7,0.2,1);
    }
    .liquid-shine:hover::after { left: 140%; }

    /* ===== THEME REVEAL ===== */
    #themeOverlay { position: fixed; inset: 0; pointer-events: none; z-index: 9999; clip-path: circle(0% at var(--ox,95%) var(--oy,5%)); background: #FFFBEB; opacity: 0; transition: none; }
    #themeOverlay.active { clip-path: circle(150% at var(--ox,95%) var(--oy,5%)); opacity: 1; }
    #themeOverlay.to-dark { background: #0A0A0A; }
    body, section, nav, footer, .glass, .glass-dark { transition: background-color .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease; }
    #themeToggle { transition: transform .3s ease; }
    #themeToggle:active { transform: scale(0.88) rotate(12deg); }
    .font-display { letter-spacing: -0.03em; }
    .font-serif.italic { background: linear-gradient(135deg,#FACC15 0%,#CA8A04 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    html.light .font-serif.italic { -webkit-text-fill-color: #CA8A04; background: none; }
    #progress { transform-origin: 0 50%; transform: scaleX(0); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #FACC15; border-radius: 999px; }
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-stopped { overflow: hidden; }
    .noise { position: absolute; inset: 0; pointer-events: none; opacity: 0.05; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E"); }
    .glow-blob { position: absolute; border-radius: 999px; pointer-events: none; filter: blur(90px); }
    .no-bar::-webkit-scrollbar { display: none; }
    .no-bar { scrollbar-width: none; }

    /* ===== LOGO BADGE ===== */
    .logo-badge { position: relative; display: inline-grid; place-items: center; flex: 0 0 auto; border-radius: 999px; overflow: hidden; background: #0A0A0A; }
    .logo-badge > img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.12); }

    /* ===== CATEGORY BAR ===== */
    #catbarWrap { position: sticky; top: 84px; z-index: 30; }
    #catbarWrap::before { content: ""; position: absolute; inset: -12px -16px; background: rgba(10,10,10,.74); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.08); border-radius: 26px; z-index: -1; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #catbarWrap.stuck::before { opacity: 1; }
    html.light #catbarWrap::before { background: rgba(255,251,235,.86); border-color: rgba(0,0,0,.06); }
    .catbtn { border-radius: 999px; padding: 9px 15px; font-size: 12.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; cursor: pointer; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: inherit; display: inline-flex; align-items: center; gap: 7px; transition: transform .3s cubic-bezier(.2,.7,.2,1), background .3s, color .3s, border-color .3s, box-shadow .3s; }
    .catbtn:hover { transform: translateY(-2px); border-color: rgba(250,204,21,.5); }
    .catbtn.on { background: linear-gradient(135deg,#FACC15 0%,#EAB308 100%) !important; color: #0A0A0A !important; border-color: transparent !important; box-shadow: 0 12px 30px -12px rgba(250,204,21,.75); }
    .catbtn b { font-size: 10.5px; font-weight: 800; opacity: .55; }
    .catbtn.on b { opacity: .8; }
    html.light .catbtn { background: #FFFFFF; border-color: rgba(0,0,0,.08); }
    html.light .catbtn:not(.on):hover { border-color: rgba(161,98,7,.45); }

    /* ===== SECTION HEADS ===== */
    .msect { scroll-margin-top: 160px; }
    .sect-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
    html.light .sect-head { border-color: rgba(0,0,0,.08); }
    .sect-emoji { font-size: 30px; line-height: 1; filter: drop-shadow(0 10px 18px rgba(250,204,21,.22)); }
    .sect-title { font-family: 'Bebas Neue'; font-size: clamp(30px, 5vw, 42px); line-height: .92; letter-spacing: -.015em; }
    .sect-num { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; color: #EAB308; font-size: 15px; letter-spacing: .08em; }
    html.light .sect-num { color: #A16207; }
    .sect-sub { font-size: 12.5px; font-weight: 600; opacity: .58; margin-top: 5px; letter-spacing: .03em; }
    .sect-count { font-size: 10.5px; font-weight: 800; letter-spacing: .18em; opacity: .6; white-space: nowrap; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); }
    html.light .sect-count { border-color: rgba(0,0,0,.1); }

    /* ===== DISH CARD ===== */
    .dish {
      position: relative; border-radius: 26px; overflow: hidden;
      display: flex; flex-direction: column;
      background: #141414;
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 20px 50px -30px rgba(0,0,0,.95);
      transition: transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s, border-color .5s;
    }
    html.light .dish { background: #FFFFFF; border-color: rgba(0,0,0,.06); box-shadow: 0 18px 44px -28px rgba(0,0,0,.35); }
    .dish:hover { transform: translateY(-6px); border-color: rgba(250,204,21,.55); box-shadow: 0 34px 64px -30px rgba(250,204,21,.35), 0 20px 50px -28px rgba(0,0,0,.9); }
    .dish .ph { position: relative; height: 200px; overflow: hidden; background: #1c1c1c; }
    html.light .dish .ph { background: #F3EEDC; }
    .dish .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1s cubic-bezier(.2,.7,.2,1); }
    .dish:hover .ph img { transform: scale(1.08); }
    .dish .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.5), transparent 55%); }
    .dish-tags { position: absolute; top: 12px; left: 12px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; max-width: 82%; }
    .dish-tag { font-size: 9.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: rgba(10,10,10,.85); border: 1px solid rgba(255,255,255,.18); color: #FACC15; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .dish-tag.star { background: linear-gradient(135deg,#FACC15,#EAB308); color: #0A0A0A; border-color: transparent; }
    .dish-tag.spicy { color: #FCA5A5; }
    .dish-price { font-weight: 800; font-size: 12.5px; border-radius: 999px; padding: 5px 12px; background: linear-gradient(135deg,#FACC15,#EAB308); color: #0A0A0A; box-shadow: 0 10px 24px -12px rgba(250,204,21,.8); white-space: nowrap; flex: 0 0 auto; }
    .veg-dot { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid #16A34A; display: grid; place-items: center; background: #FFFFFF; flex: 0 0 auto; }
    .veg-dot i { width: 6px; height: 6px; border-radius: 999px; background: #16A34A; display: block; }
    .add-btn { border-radius: 999px; padding: 10px 16px; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; background: linear-gradient(135deg,#FACC15,#EAB308); color: #0A0A0A; transition: transform .3s, box-shadow .3s, filter .3s; }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -14px rgba(250,204,21,.85); filter: brightness(1.04); }
    .dish.hide, .msect.hide { display: none !important; }
    .spicy-chip { font-size: 11px; letter-spacing: -1px; }
    #noResults { display: none; }
    #noResults.show { display: block; }

    /* ===== FOOTER ===== */
    .foot-link { letter-spacing: .14em; font-weight: 700; opacity: .6; transition: opacity .25s, color .25s; }
    .foot-link:hover { opacity: 1; color: #FACC15; }
    @media (prefers-reduced-motion: reduce) { .liquid-shine::after { display: none; } }
  </style>
  <script src="protect.js" defer></script>
  <script src="cookie-banner.js" defer></script>
  <script src="credit.js" defer></script>
  <script src="live-clock.js" defer></script>
</head>
<body class="bg-ink text-cream font-sans overflow-x-hidden">
  <script src="skeleton.js"></script>
  <div id="themeOverlay"></div>
  <div class="fixed top-0 left-0 w-full h-[3px] bg-white/10 z-[100]">
    <div id="progress" class="h-full bg-mustard w-full"></div>
  </div>

  <!-- ===== NAV ===== -->
  <nav id="navbar" class="fixed top-4 left-1/2 -translate-x-1/2 w-[92%] max-w-[1280px] z-50">
    <div class="glass-dark rounded-[20px] md:rounded-full px-3 md:px-6 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <span class="logo-badge w-[52px] h-[52px] ring-1 ring-mustard/40 shrink-0"><img src="https://i.postimg.cc/2j4wTB2c/image.png" alt="Indiana Restaurant & Cafe logo"></span>
        <span class="font-display text-[22px] tracking-[0.04em] leading-none hidden sm:block">INDIANA</span>
        <span class="hidden sm:block text-[10px] tracking-[0.18em] opacity-60 -ml-1 font-semibold">RESTAURANT &amp; CAFE</span>
      </a>
      <div class="hidden lg:flex items-center gap-2 text-[12.5px] font-semibold tracking-wide">
        <a href="index.html" class="px-4 py-2 rounded-full hover:bg-white/10 transition">Home</a>
        <a href="about.html" class="px-4 py-2 rounded-full hover:bg-white/10 transition">About ↗</a>
        <a href="menu.html" class="px-4 py-2 rounded-full bg-white text-ink">Menu ↗</a>
        <a href="gallery.html" class="px-4 py-2 rounded-full hover:bg-white/10 transition">Gallery ↗</a>
        <a href="reserve.html" class="px-4 py-2 rounded-full hover:bg-white/10 transition">Reserve</a>
      </div>
      <div class="flex items-center gap-2">
        <button id="themeToggle" title="Toggle Light/Dark" class="w-10 h-10 rounded-full glass grid place-items-center text-sm">🌙</button>
        <button id="cartBtn" class="hidden sm:inline-flex items-center gap-2 bg-mustard text-ink rounded-full px-5 py-[10px] font-extrabold text-[13px] tracking-wide">
          CART <span class="w-6 h-6 rounded-full bg-ink text-mustard grid place-items-center text-[11px]"><span id="cartCount">0</span></span>
        </button>
        <button id="menuBtn" class="lg:hidden w-10 h-10 rounded-full bg-white text-ink grid place-items-center">☰</button>
      </div>
    </div>
  </nav>

  <!-- ===== MOBILE DRAWER ===== -->
  <div id="drawer" class="fixed inset-0 z-40 bg-ink/90 backdrop-blur-xl translate-x-full transition duration-500 lg:hidden flex flex-col p-8 pt-24 gap-6 text-2xl font-display tracking-widest">

    <a href="about.html" class="drawer-link">ABOUT</a>
    <a href="menu.html" class="drawer-link">MENU</a>
    <a href="gallery.html" class="drawer-link">GALLERY</a>
    <a href="reserve.html" class="drawer-link">RESERVE</a>
    <button id="closeDrawer" class="absolute top-6 right-6 w-10 h-10 rounded-full bg-white text-ink">✕</button>
  </div>

  <!--HERO-->
</html>
